  <div class="shell layout" id="top">
    <aside class="sidebar" aria-label="Perfil e contato">
      <img class="side__photo" id="hero-photo" src="assets/media/pedro.webp" width="320" height="320" alt="Foto de Pedro Henrique Rocha de Andrade">
      <div class="side__id">
        <p class="side__name" id="side-name"></p>
        <p class="side__tagline" id="side-tagline"></p>
        <p class="side__loc"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#pin"/></svg><span id="side-loc"></span></p>
      </div>
      <ul class="side__links" id="side-links"></ul>
      <p class="side__nick" id="side-nick"></p>
      <a class="btn btn--primary side__cv" href="https://www.phrandrade.com/resource/areas/profissional/curriculo/cv-academico-pt.pdf" target="_blank" rel="noopener" id="side-cv">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#file"/></svg><span data-ui="cvDownload"></span>
      </a>
    </aside>

    <main class="content">
      <div class="hero-band">
        <canvas id="sky" aria-hidden="true"></canvas>
        <section class="hero">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-name"></h1>
          <p class="lead" id="hero-sub"></p>
          <ul class="chips" id="hero-badges"></ul>
        </section>
      </div>

      <ul class="stats" id="stats" aria-label="Números"></ul>

      <section id="sobre" class="block">
        <h2 data-sec="sobre"></h2>
        <div class="prose" id="about"></div>
      </section>

      <section id="projetos" class="block">
        <h2 data-sec="projetos"></h2>
        <p class="sec-lead" data-lead="projetos"></p>
        <div class="grid" id="featured"></div>
      </section>

      <section id="trabalhos" class="block">
        <h2 data-sec="trabalhos"></h2>
        <p class="sec-lead" data-lead="trabalhos"></p>
        <div class="filters">
          <div class="tabs" id="cat-tabs" role="tablist"></div>
          <input type="search" id="search">
        </div>
        <div class="grid" id="repos"></div>
        <p class="empty" id="repos-empty" hidden>—</p>
      </section>

      <section id="pesquisa" class="block">
        <h2 data-sec="pesquisa"></h2>
        <p class="sec-lead" data-lead="pesquisa"></p>
        <figure class="spectrum">
          <canvas id="spectrum-canvas" aria-hidden="true"></canvas>
          <input type="range" id="spectrum-slider" min="3800" max="8600" step="1" value="6563">
          <figcaption><span id="spectrum-info" class="mono" aria-live="polite"></span><span id="spectrum-hint"></span></figcaption>
        </figure>
        <div class="grid" id="research"></div>
      </section>

      <section id="bolsas" class="block">
        <h2 data-sec="bolsas"></h2>
        <p class="sec-lead" data-lead="bolsas"></p>
        <ol class="timeline" id="grants"></ol>
      </section>

      <section id="eventos" class="block">
        <h2 data-ui="alemTitle"></h2>
        <p class="sec-lead" data-ui="alemLead"></p>
        <ol class="events" id="events"></ol>
      </section>

      <section id="curriculo" class="block">
        <h2 data-sec="curriculo"></h2>
        <p id="cv-text"></p>
        <div class="cv-preview" id="cv-preview"></div>
        <div class="cv-grid" id="cv-grid"></div>
        <div class="actions"><a class="btn" href="https://github.com/pedroiff0/cv" target="_blank" rel="noopener" data-ui="cvRepo"></a></div>
      </section>

      <section id="lattes" class="block">
        <h2 data-sec="lattes"></h2>
        <p id="lattes-text"></p>
        <p class="mono">ID Lattes: <code>6818168089966785</code></p>
        <div class="actions">
          <a class="btn btn--primary" href="http://lattes.cnpq.br/6818168089966785" target="_blank" rel="noopener" data-ui="lattesOpen"></a>
        </div>
      </section>

      <section id="contato" class="block">
        <h2 data-sec="contato"></h2>
        <p class="sec-lead" data-lead="contato"></p>
        <div class="contacts" id="contacts"></div>
      </section>
    </main>

  <button type="button" class="reader-exit" id="reader-exit" aria-label="Sair do modo leitura"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#reader"/></svg></button>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="qr" class="qr" aria-labelledby="qr-title">
    <button type="button" class="qr__close" id="qr-close" aria-label="Fechar">&times;</button>
    <div class="qr__head">
      <img class="qr__img" src="assets/media/qrcode.png" alt="QR code www.phrandrade.com" width="120" height="120">
      <div>
        <p class="qr__kicker" data-ui="qrKicker"></p>
        <h2 class="qr__title" id="qr-title" data-ui="qrTitle"></h2>
      </div>
    </div>
    <div class="qr__grid" id="qr-links"></div>
    <p class="qr__note" id="qr-note"></p>
  </dialog>

  <dialog id="lightbox" class="lightbox" aria-label="Fotos">
    <button type="button" class="lightbox__close" id="lb-close" aria-label="Fechar">&times;</button>
    <button type="button" class="lightbox__nav lightbox__prev" id="lb-prev" aria-label="Anterior">&#8249;</button>
    <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
    <button type="button" class="lightbox__nav lightbox__next" id="lb-next" aria-label="Próxima">&#8250;</button>
  </dialog>

  <dialog id="busca" class="busca" aria-label="Busca">
    <div class="busca__space">
      <input id="busca-input" class="busca__input" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-controls="busca-results" aria-expanded="true">
      <div class="busca__layout">
        <div class="busca__results" id="busca-results" role="listbox"></div>
        <div class="busca__preview" id="busca-preview" aria-live="polite"></div>
      </div>
    </div>
  </dialog>

  <dialog id="tour" class="tour" aria-labelledby="tour-title">
    <div class="tour__stage" id="tour-stage">
      <video id="tour-video" playsinline loop muted preload="none"></video>
    </div>
    <div class="tour__panel">
      <button type="button" class="tour__btn" id="tour-play" aria-label="Pausar"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#pause"/></svg></button>
      <strong class="tour__title" id="tour-title"></strong>
      <input type="range" class="tour__seek" id="tour-seek" min="0" max="1000" value="0" aria-label="Posição do vídeo">
      <span class="tour__time" id="tour-time">0:00 / 0:00</span>
      <a class="tour__link" id="tour-open" target="_blank" rel="noopener" hidden></a>
      <a class="tour__link" id="tour-repo" target="_blank" rel="noopener" hidden></a>
      <button type="button" class="tour__btn" id="tour-fs" aria-label="Tela cheia"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#expand"/></svg></button>
      <button type="button" class="tour__btn" id="tour-close" aria-label="Fechar">&times;</button>
    </div>
  </dialog>

  <dialog id="live" class="live" aria-labelledby="live-title">
    <div class="live__bar">
      <strong id="live-title"></strong>
      <a id="live-open" target="_blank" rel="noopener"></a>
      <button type="button" id="live-close" class="live__close" aria-label="Fechar">&times;</button>
    </div>
    <div class="live__frame" id="live-frame"></div>
  </dialog>

  <footer class="footer" id="rodape">
    <div class="shell footer__bar">
      <span class="footer__frase">
        <span id="footer-name"></span>
        <a class="footer__marca" href="#top">phrandrade<span>.portfolio</span></a>
        <span id="footer-text"></span>
        <span class="footer__ico" role="img" id="ico-cafe"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#coffee"/></svg></span>,
        <span class="footer__ico" role="img" id="ico-codigo"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#code"/></svg></span>
        <span id="footer-and"></span>
        <span class="footer__ico" role="img" id="ico-cometa"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#comet"/></svg></span>
        <span id="footer-by"></span>
        <a href="https://www.phrandrade.com/pt-br/" target="_blank" rel="noopener" id="footer-author"></a>
        <span class="footer__sep" aria-hidden="true">·</span>
        <span id="footer-updated"></span>
      </span>
      <ul class="footer__social" id="footer-social" aria-label="Redes"></ul>
      <a class="footer__top" href="#top" id="footer-top"></a>
    </div>
  </footer>

  <script src="assets/js/spectrum.js"></script>
  <script src="assets/js/conquistas.js"></script>
